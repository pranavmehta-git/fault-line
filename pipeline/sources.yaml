# Impact signal keywords
impact_patterns:
  positive_fragility:  # Increases fragility score
    - "exclusive"
    - "lock-in"
    - "dependent"
    - "shortage"
    - "constraint"
    - "investigation"
    - "scrutiny"
    - "decline"
    - "challenge"
    - "concern"
    - "risk"
    - "delay"
    
  negative_fragility:  # Decreases fragility score (resilience)
    - "diversif"
    - "expand"
    - "partner"
    - "multi"
    - "alternative"
    - "redundan"
    - "secure"
    - "contract"
    - "growth"
    - "strong"
