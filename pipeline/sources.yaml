# Fault Line - News Sources Configuration
# Each source is checked during pipeline runs

sources:
  # Primary tech news RSS feeds
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"
    type: "rss"
    enabled: true
    priority: 1
    
  - name: "VentureBeat AI"
    url: "https://venturebeat.com/category/ai/feed/"
    type: "rss"
    enabled: true
    priority: 1
    
  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/technology-lab"
    type: "rss"
    enabled: true
    priority: 2
    
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    type: "rss"
    enabled: true
    priority: 2

  - name: "Wired"
    url: "https://www.wired.com/feed/rss"
    type: "rss"
    enabled: true
    priority: 2
    
  - name: "MIT Technology Review"
    url: "https://www.technologyreview.com/feed/"
    type: "rss"
    enabled: true
    priority: 1

  # Authoritative / institutional sources
  - name: "Reuters Technology"
    url: "https://www.reutersagency.com/feed/?best-topics=tech"
    type: "rss"
    enabled: true
    priority: 1

  - name: "Nature News"
    url: "https://www.nature.com/nature.rss"
    type: "rss"
    enabled: true
    priority: 1

  - name: "Science Magazine"
    url: "https://www.science.org/rss/news_current.xml"
    type: "rss"
    enabled: true
    priority: 2

  # Government / regulatory sources
  - name: "FTC Press Releases"
    url: "https://www.ftc.gov/feeds/press-release.xml"
    type: "rss"
    enabled: true
    priority: 1

  - name: "DOJ Press Releases"
    url: "https://www.justice.gov/feeds/opa/justice-news.xml"
    type: "rss"
    enabled: true
    priority: 1

  # Tier 1 regulatory / institutional sources — SEC EDGAR
  # EDGAR XBRL RSS feeds are per-company. These track filings (10-K, 10-Q, 8-K)
  # for the parent companies of tracked labs.
  - name: "SEC EDGAR - Microsoft (OpenAI partner)"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0000789019&type=&dateb=&owner=include&count=20&search_text=&action=getcompany&output=atom"
    type: "rss"
    source_type: "regulatory"
    enabled: true
    priority: 1

  - name: "SEC EDGAR - Alphabet (DeepMind parent)"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001652044&type=&dateb=&owner=include&count=20&search_text=&action=getcompany&output=atom"
    type: "rss"
    source_type: "regulatory"
    enabled: true
    priority: 1

  - name: "SEC EDGAR - Meta Platforms"
    url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001326801&type=&dateb=&owner=include&count=20&search_text=&action=getcompany&output=atom"
    type: "rss"
    source_type: "regulatory"
    enabled: true
    priority: 1

  - name: "EU AI Office Publications"
    url: "https://digital-strategy.ec.europa.eu/en/rss.xml"
    type: "rss"
    source_type: "regulatory"
    enabled: true
    priority: 1

  # Paywalled sources (disabled - no public RSS)
  - name: "Bloomberg Technology"
    url: "https://www.bloomberg.com/feed/technology"
    type: "rss"
    enabled: false
    priority: 1

  - name: "Financial Times"
    url: "https://www.ft.com/technology?format=rss"
    type: "rss"
    enabled: false
    priority: 1

  # Official AI Lab Sources
  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    type: "rss"
    source_type: "lab_blog"
    lab_id: "openai"
    enabled: true
    priority: 1

  - name: "Anthropic News"
    url: "https://www.anthropic.com/rss.xml"
    type: "rss"
    source_type: "lab_blog"
    lab_id: "anthropic"
    enabled: true
    priority: 1

  - name: "Google DeepMind Blog"
    url: "https://blog.google/technology/ai/rss/"
    type: "rss"
    source_type: "lab_blog"
    lab_id: "deepmind"
    enabled: true
    priority: 1

  - name: "Meta AI Blog"
    url: "https://ai.meta.com/blog/rss/"
    type: "rss"
    source_type: "lab_blog"
    lab_id: "meta"
    enabled: true
    priority: 1

